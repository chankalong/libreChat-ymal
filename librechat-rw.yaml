version: 1.3.14
cache: true
fileStrategy: "azure_blob"
registration:
  allowedDomains:
    - "bokss.org.hk"
endpoints:
  agents:
    recursionLimit: 50
    maxRecursionLimit: 100
    disableBuilder: false
  custom:
    # OpenRouter.ai
    # Model list: https://openrouter.ai/models
    # Script to fetch models: https://github.com/LibreChat-AI/librechat-config-yaml/blob/main/scripts/openrouter.py
    - name: "多模型互補"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      headers:
        X-Session-Id: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
      addParams:
        cache_control:
          type: ephemeral
      models:
        default: [
          "---先由多個模型同時進行並處理---",
          "---再由審查模型對各回答進行分析---",
          "---最後整合出最好的回答---",
          "---真係好貴好貴好貴好貴---",
          "---真係好貴好貴好貴好貴---",
          "---真係好貴好貴好貴好貴---",
          "---諗清楚先好用---",
          "openrouter/fusion",
          ]
        fetch: false
      titleConvo: true
      summarize: false
      modelDisplayLabel: "多模型互補"
    - name: "最勁最貴最慢AI"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      headers:
        X-Session-Id: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
      addParams:
        cache_control:
          type: ephemeral
      models:
        default: [
          "---真係好貴---",
          "---真係好貴---",
          "---真係好貴---",
          "---諗清楚先好用---",
          "openai/gpt-5.6-sol-pro",
          "openai/gpt-5.6-sol",
          "openai/gpt-5.6-terra-pro",
          "openai/gpt-5.6-terra",
          "openai/gpt-5.3-codex",
          "anthropic/claude-opus-5",
          "google/gemini-3.1-pro-preview",
          "x-ai/grok-4.6",
          "x-ai/grok-build-0.1",
          "x-ai/grok-4.20-multi-agent",
          "perplexity/sonar-reasoning-pro",
          "perplexity/sonar-pro-search"
          ]
        fetch: false
      titleConvo: true
      summarize: false
      modelDisplayLabel: "我係最勁最貴最慢嘅AI"
    - name: "國產頂級AI"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      headers:
        X-Session-Id: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
      addParams:
        cache_control:
          type: ephemeral
      models:
        default: [
          "z-ai/glm-5.2",
          "z-ai/glm-5-turbo",
          "deepseek/deepseek-v4-pro",
          "moonshotai/kimi-k3",
          "moonshotai/kimi-k2.7-code",
          "moonshotai/kimi-k2.6",
          "xiaomi/mimo-v2.5-pro",
          "tencent/hy3",
          "qwen/qwen3.8-2.4t-a95b"
          ]
        fetch: false
      titleConvo: true
      summarize: false
      modelDisplayLabel: "我係國產頂級AI"
    - name: "適合一般用途嘅AI"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      headers:
        X-Session-Id: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
      addParams:
        cache_control:
          type: ephemeral
      models:
        default: [
          "openai/gpt-5.6-luna-pro",
          "openai/gpt-5.6-luna",
          "openai/gpt-5.4-mini",
          "anthropic/claude-sonnet-5",
          "google/gemini-3.7-flash",
          "thinkingmachines/inkling",
          "perplexity/sonar-pro",
          "perplexity/sonar-reasoning",
          "perplexity/r1-1776",
          "minimax/minimax-m3",
          "xiaomi/mimo-v2.5",
          "qwen/qwen3.6-27b",
          "bytedance-seed/seed-2-1-turbo"
          ]
        fetch: false
      titleConvo: true
      summarize: false
      modelDisplayLabel: "我係適合一般用途嘅AI"
    - name: "超平超快超廢"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      headers:
        X-Session-Id: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
      addParams:
        cache_control:
          type: ephemeral
      models:
        default: [
          "anthropic/claude-haiku-4.5",
          "openai/gpt-5.4-nano",
          "google/gemini-3.5-flash-lite",  
          "thinkingmachines/inkling-small",
          "z-ai/glm-4.7-flash",
          "qwen/qwen3.6-35b-a3b",
          "perplexity/sonar",
          "deepseek/deepseek-v4-flash-0731",
          "meta/muse-glimmer-30b"
          ]
        fetch: false
      titleConvo: true
      summarize: false
      modelDisplayLabel: "我係超平超快超廢嘅AI"
  azureOpenAI:
    # Endpoint-level configuration
    titleModel: "gpt-4.1-nano"
    groups:
    # Group-level configuration
    - group: "ai-imhs-westus3"
      apiKey: "${IMAGE_GEN_OAI_API_KEY}"
      instanceName: "ai-imhs-westus3"
      version: "2025-04-01-preview"
      # Model-level configuration
      models:
        gpt-4.1-nano:
          deploymentName: gpt-4.1-nano
        gpt-4.1:
          deploymentName: gpt-4.1
mcpServers:  
  # Production-ready cloud service
  google-image-lite:
    type: streamable-http
    url: https://image-generate-googlelite-mcp.vercel.app/api/mcp
    timeout: 300000
    serverInstructions: true
    requiresOAuth: false
    chatMenu: true
    headers:
      X-Auth-Token: "${MCP_GOOGLE_IMAGE_AUTH_TOKENS}"
  google-image:
    type: streamable-http
    url: https://image-generate-mcp.vercel.app/api/mcp
    timeout: 300000
    serverInstructions: true
    requiresOAuth: false
    chatMenu: true
    headers:
      X-Auth-Token: "${MCP_GOOGLE_IMAGE_AUTH_TOKENS}"
  openai-image:
    type: streamable-http
    url: https://image-generate-openai-mcp.vercel.app/api/mcp
    timeout: 300000
    serverInstructions: true
    requiresOAuth: false
    chatMenu: true
    headers:
      X-Auth-Token: "${MCP_GOOGLE_IMAGE_AUTH_TOKENS}"
  convert-to-excel:
    type: streamable-http
    url: https://convert-excel.vercel.app/api/mcp
    timeout: 300000
    serverInstructions: true
    chatMenu: true
ocr:
  mistralModel: "${AZURE_MISTRAL_OCR_MODEL}"              # Should match your Azure deployment name
  apiKey: "${AZURE_MISTRAL_OCR_API_KEY}"                 # Reference to your Azure API key in .env
  baseURL: "${AZURE_MISTRAL_OCR_URL}"  # Your Azure endpoint
  strategy: "azure_mistral_ocr"                          # Use Azure strategy
messageFilter:
  pii:
    starterPatterns:
      - sk_prefix
      - bearer_header
      - api_key_header
    customPatterns:
      - id: anthropic_api_key
        label: Anthropic API key
        regex: 'sk-ant-[A-Za-z0-9_-]{20,}'
      - id: email
        label: Email address
        regex: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,63}\b'
      - id: hk_phone
        label: Hong Kong phone number
        regex: '(?:^|[^0-9A-Za-z])(?:[+]852[ -]*|852[ -]*)?[2-9][0-9]{3}[ -]?[0-9]{4}(?:$|[^0-9A-Za-z])'
      - id: credit_card
        label: Credit card number
        regex: '\b(?:[0-9][ -]?){12,18}[0-9]\b'
      - id: hkid
        label: Hong Kong Identity Card
        regex: '(?:[A-Za-z][ ]*){1,2}(?:[0-9][ ]*){6}(?:[(][ ]*[0-9Aa][ ]*[)]|[0-9Aa])'       #'\(?\s*[A-Za-z]\s*(?:\d\s*){6}\s*\)?(?:\s*\(?\s*[0-9Aa]\s*\)?)?'
skillSync:
  github:
    enabled: true
    intervalMinutes: 60
    runOnStartup: true
    sources:
      - id: steve-jobs-skill
        owner: chankalong
        repo: steve-jobs-skill
        ref: main
        paths:
          - .
        skillDiscoveryDepth: 2
        token: '${GITHUB_SKILLS_TOKEN}'
      - id: speak-human-tw
        owner: chankalong
        repo: speak-human-tw
        ref: master
        paths:
          - .
        skillDiscoveryDepth: 2
        token: '${GITHUB_SKILLS_TOKEN}'
      - id: Humanizer-zh-TW
        owner: chankalong
        repo: Humanizer-zh-TW
        ref: main
        paths:
          - .
        skillDiscoveryDepth: 2
        token: '${GITHUB_SKILLS_TOKEN}'
      - id: refresh-insights-writing
        owner: chankalong
        repo: bokss-skill
        ref: main
        paths:
          - refresh-insights-writing
        skillDiscoveryDepth: 2
        token: '${GITHUB_SKILLS_TOKEN}'
interface:
  # 一進入系統即清楚說明這是工作草稿工具，而不是個案服務系統。
  customWelcome: |
    歡迎使用機構認可 AI 助手。你可以用它協助教育推廣、公開文案及行政草稿。
    請勿輸入、上載或貼出任何服務使用者、個案、健康、身份或聯絡資料。
    所有輸出均須由同工覆核，不能取代專業判斷。

  # 首次使用前要求同工確認基本 AI 使用守則；LibreChat 會記錄接受狀態與時間。
  termsOfService:
    modalAcceptance: true
    modalTitle: "機構 AI 使用守則"
    modalContent: |
      ## 使用前請確認

      本工具只可用於教育推廣、公開溝通及非個案化行政草稿。

      1. 不可輸入、貼出或上載服務使用者姓名、聯絡資料、個案紀錄、健康資料、身份資料、錄音、影像或其他可識別個人資料。
      2. AI 產出只屬草稿；在對外發布或用於服務前，必須由具相關職責的同工覆核事實、文化敏感度及專業適切性。
      3. 本工具不會作出診斷、危機評估或治療建議，亦不可取代專業判斷和既有服務程序。
      4. 如不確定內容是否適合輸入，請先刪除可識別資料，或向主管／資料私隱負責同工查詢。

  # 保留 token 使用量作透明度提示，但不顯示金額，避免技術和成本焦慮。
  contextUsage: true
  contextCost: false
  modelSelect: true
  parameters: true
  presets: true
  skills:
    use: true
    create: true
    share: true
    public: true
    defaultActiveOnShare: true
  defaultPinnedTools:
    - skills
    - mcp
memory:
  disabled: false
  tokenLimit: 2000
  charLimit: 10000
  maxInputTokens: 12000
  personalize: true
  messageWindowSize: 5
  agent:
    enabled: true
    provider: '適合一般用途嘅AI'
    model: 'google/gemini-3.7-flash'
    instructions: 'You are a helpful assistant that remembers user preferences and context.'
    model_parameters:
      temperature: 0.7
      max_tokens: 1000
modelSpecs:
  enforce: false
  prioritize: true
  list:
    - name: ngo-writing-admin
      label: 文案及行政助手
      #softDefault: true
      #showInMenu: true
      group: 機構認可助手
      groupIcon: openrouter
      description: 協助撰寫公開活動文案、整理會議重點及草擬非個案電郵。
      #showOnLanding: true
      #hideBadgeRow: true
      # 只可使用兩個已核實、與繁體中文編修直接相關的 Skills。
      skills:
        - "speak-human-tw"
        - "humanizer-zh-tw"
      conversation_starters:
        - 將以下公開活動文案改成親切、清晰的繁體中文
        - 根據以下不含個人資料的會議筆記整理行動項目
        - 草擬一封邀請同工參與情緒教育活動的電郵
      preset:
        endpoint: "適合一般用途嘅AI"
        model: "anthropic/claude-sonnet-5"
        modelLabel: 文案及行政助手
        greeting: |
          我可以協助草擬公開文案、非個案電郵及會議整理。
          請勿輸入或上載服務使用者／個案資料；輸出屬草稿，使用前請自行覆核。
        #temperature: 0.4
        #max_tokens: 2500
        # Claude 經 OpenRouter 可使用 provider prompt cache。
        #promptCache: true
        #promptCacheTtl: "5m"
        # 若日後檔案功能被開啟，避免在對話持續時重傳檔案。
        #resendFiles: false
        promptPrefix: |
          你是香港精神健康 NGO 的內部文案及行政助手。
          你可協助教育推廣、公開溝通、行政整理及非個案化的工作草稿。
          不可作出診斷、危機評估、治療建議或取代專業判斷。
          不可處理服務使用者姓名、聯絡資料、個案紀錄、健康資料、身份資料、錄音、影像或其他可識別個人資料。
          如使用者提供上述資料，請要求對方刪除資料，改用去識別化、非個案化描述。
          所有輸出均為草稿，必須由同工覆核事實、文化敏感度及專業適切性。
    - name: ngo-emotional-education
      label: 情緒教育活動設計助手
      #showInMenu: true
      group: 機構認可助手
      groupIcon: openrouter
      description: 協助設計非臨床的情緒教育活動、工作坊大綱和宣傳內容。
      #showOnLanding: true
      #hideBadgeRow: true
      skills:
        - "speak-human-tw"
        - "humanizer-zh-tw"
      conversation_starters:
        - 為中學生設計一個 45 分鐘的情緒覺察活動大綱
        - 將以下心理健康教育重點整理成互動工作坊流程
        - 為家長講座草擬三個不帶標籤的討論問題
      askUserQuestion: true
      preset:
        endpoint: "適合一般用途嘅AI"
        model: "google/gemini-3.7-flash"
        modelLabel: 情緒教育活動設計助手
        greeting: |
          我可以協助設計非臨床的情緒教育活動及公開宣傳草稿。
          我不會作出診斷、危機評估或治療建議；請勿輸入個案或服務使用者資料。
        #temperature: 0.6
        #max_tokens: 2500
        #resendFiles: false
        promptPrefix: |
          你協助香港精神健康 NGO 設計非臨床的情緒教育及預防推廣材料。
          請使用尊重、包容、非污名化的繁體中文，避免把情緒反應簡化為疾病標籤。
          不可作出診斷、危機評估、治療建議或取代專業判斷。
          不可處理服務使用者姓名、聯絡資料、個案紀錄、健康資料、身份資料、錄音、影像或其他可識別個人資料。
          如使用者提供上述資料，請要求對方刪除資料，改用去識別化、非個案化描述。
          輸出應視為教育材料草稿，必須由具相關專業知識的同工覆核。
    - name: ngo-plain-language
      label: 清晰文字及翻譯助手
      #showInMenu: true
      group: 機構認可助手
      groupIcon: openrouter
      description: 協助把公開資料改寫成易讀繁體中文，或整理中英文初稿。
      #showOnLanding: true
      #hideBadgeRow: true
      skills:
        - "speak-human-tw"
        - "humanizer-zh-tw"
      conversation_starters:
        - 將以下內容改寫成香港常用、易理解的繁體中文
        - 將以下英文公開資料翻譯成自然的香港繁體中文
        - 將以下訊息縮短為適合社交媒體發布的版本
      preset:
        endpoint: "適合一般用途嘅AI"
        model: "openai/gpt-5.4-mini"
        modelLabel: 清晰文字及翻譯助手
        greeting: |
          我可以協助改寫或翻譯公開內容，令文字自然、清晰及適合香港讀者。
          請勿輸入服務使用者／個案資料；對外使用前請覆核事實與語氣。
        #temperature: 0.3
        #max_tokens: 1800
        #resendFiles: false
        promptPrefix: |
          你是香港精神健康 NGO 的清晰文字及翻譯助手。
          請以自然、尊重、容易理解的香港繁體中文協助改寫或翻譯公開內容；如原文不清楚，請列出需要澄清之處，不要自行編造事實。
          不可作出診斷、危機評估、治療建議或取代專業判斷。
          不可處理服務使用者姓名、聯絡資料、個案紀錄、健康資料、身份資料、錄音、影像或其他可識別個人資料。
          如使用者提供上述資料，請要求對方刪除資料，改用去識別化、非個案化描述。
          所有輸出均為草稿，必須由同工覆核後才可對外使用。
